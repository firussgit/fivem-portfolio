<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dispatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="panel" class="hidden">
    <header>
      <div>
        <span class="kicker">DISPATCH</span>
        <h1 id="title">Police Dispatch</h1>
      </div>
      <button id="closeBtn" aria-label="Close">&times;</button>
    </header>

    <p id="hint" class="hint">Stay on duty to receive calls.</p>

    <div id="calls" class="calls">
      <div class="empty">Requesting calls&hellip;</div>
    </div>

    <footer id="footer"></footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
