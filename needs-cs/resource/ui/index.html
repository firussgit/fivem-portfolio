<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Needs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud" class="hidden">
    <div class="need" id="hungerBox">
      <span class="name">Food</span>
      <div class="bar"><div id="hungerFill"></div></div>
      <span class="value" id="hungerValue">0</span>
    </div>
    <div class="need" id="thirstBox">
      <span class="name">Water</span>
      <div class="bar"><div id="thirstFill"></div></div>
      <span class="value" id="thirstValue">0</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
