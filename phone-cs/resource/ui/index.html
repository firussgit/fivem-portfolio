<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="phone" class="hidden">
    <header>
      <span id="myNumber">---</span>
      <button id="close" aria-label="Close">&times;</button>
    </header>

    <!-- Messages: conversation list, then a thread -->
    <section id="tab-messages" class="tab">
      <div id="threads"></div>
      <form id="newMessage">
        <input id="newTo" placeholder="New message to 555-0123" maxlength="8" autocomplete="off">
        <button>Open</button>
      </form>
    </section>

    <section id="tab-thread" class="tab hidden">
      <div class="bar"><button id="back">&lsaquo; Back</button><strong id="threadTitle"></strong></div>
      <div id="bubbles"></div>
      <form id="composer">
        <input id="body" placeholder="Message" maxlength="280" autocomplete="off">
        <button>Send</button>
      </form>
    </section>

    <!-- Contacts -->
    <section id="tab-contacts" class="tab hidden">
      <div id="contacts"></div>
      <form id="addContact">
        <input id="cName" placeholder="Name" maxlength="24" autocomplete="off">
        <input id="cNumber" placeholder="555-0123" maxlength="8" autocomplete="off">
        <button>Add</button>
      </form>
    </section>

    <!-- Bank -->
    <section id="tab-bank" class="tab hidden">
      <div class="balance"><small>Bank balance</small><strong id="bankBalance">$0</strong></div>
      <form id="payForm">
        <input id="payTo" placeholder="Pay number, e.g. 555-0123" maxlength="8" autocomplete="off">
        <input id="payAmount" type="number" min="1" max="50000" placeholder="Amount">
        <button>Send money</button>
      </form>
      <div id="payHint" class="hint">Pay anyone who is online, straight from your bank account.</div>
    </section>

    <!-- Emergency: 911 (police) and 912 (medical) go to dispatch-cs -->
    <section id="tab-emergency" class="tab hidden">
      <div class="emg">
        <h2>Emergency</h2>
        <p class="hint">Dispatch sees your location automatically. Describe what is happening, then choose a service.</p>
        <textarea id="emgBody" maxlength="160" placeholder="What is happening?" autocomplete="off"></textarea>
        <button id="emgPolice" class="emgBtn police">Call 911 &middot; Police</button>
        <button id="emgMedical" class="emgBtn medical">Call 912 &middot; Medical</button>
        <button id="emgCancel" class="ghostBtn">Cancel my active call</button>
        <p id="emgState" class="hint"></p>
      </div>
    </section>

    <nav>
      <button data-tab="messages" class="active">Messages<span id="badge" class="hidden"></span></button>
      <button data-tab="contacts">Contacts</button>
      <button data-tab="bank">Bank</button>
      <button data-tab="emergency">Emergency</button>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
