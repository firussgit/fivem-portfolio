<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="shop" class="hidden">
    <header>
      <h1 id="shopName">Shop</h1>
      <button id="close" aria-label="Close">&times;</button>
    </header>

    <section class="pay">
      <span class="label">Pay with</span>
      <label class="choice"><input type="radio" name="account" value="cash" checked> Cash <strong id="cash">$0</strong></label>
      <label class="choice"><input type="radio" name="account" value="bank"> Bank <strong id="bank">$0</strong></label>
    </section>

    <table>
      <thead><tr><th>Item</th><th>Price</th><th>Stock</th><th>Qty</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="script.js"></script>
</body>
</html>
